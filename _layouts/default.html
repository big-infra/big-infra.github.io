<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <link rel="icon" href="{{ 'images/Icon.png' | relative_url }}" type="image/x-icon">
    <link rel="shortcut icon" href="{{ 'images/Icon.png' | relative_url }}" type="image/x-icon">
    <style>
      :root {
        --bg: #edf5ff;
        --bg-strong: #dfeffc;
        --surface: #ffffff;
        --surface-soft: #f3f8ff;
        --line: #d6e5f6;
        --text: #1d2d3d;
        --muted: #566b7e;
        --primary: #1d6fd6;
        --primary-deep: #0f53b2;
        --primary-soft: rgba(29, 111, 214, 0.12);
        --accent: #14a6b8;
        --shadow: rgba(18, 44, 76, 0.12);
        --success: #0f8d62;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(180deg, #edf5ff 0%, #f9fbff 100%);
        color: var(--text);
        line-height: 1.65;
      }

      a {
        color: var(--primary);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .site-header {
        background: linear-gradient(135deg, #0b264f 0%, #123f73 55%, #1b5ea4 100%);
        color: white;
        box-shadow: 0 8px 24px rgba(7, 30, 58, 0.18);
      }

      .site-header-inner {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 20px 18px;
      }

      .brand-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.08));
        border: 1px solid rgba(255,255,255,0.25);
        font-size: 1.2rem;
      }

      .brand-name {
        font-size: clamp(1.2rem, 2vw, 1.7rem);
      }

      .main-nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: flex-end;
      }

      .main-nav a {
        color: rgba(255,255,255,0.9);
        padding: 8px 12px;
        border-radius: 999px;
        font-weight: 600;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .main-nav a:hover {
        background: rgba(255,255,255,0.12);
        text-decoration: none;
        transform: translateY(-1px);
      }

      .main-nav a.active {
        background: rgba(255,255,255,0.16);
        border: 1px solid rgba(255,255,255,0.2);
      }

      .page-shell {
        max-width: 1180px;
        margin: 0 auto;
        padding: 32px 20px 72px;
      }

      .page-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 20px;
        box-shadow: 0 10px 30px var(--shadow);
        padding: 28px;
      }

      .hero {
        background: linear-gradient(135deg, rgba(29,111,214,0.08), rgba(20,166,184,0.08));
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 32px;
        margin-bottom: 24px;
      }

      h1, h2, h3, h4 {
        color: var(--text);
        line-height: 1.25;
        margin-top: 0;
      }

      h1 {
        font-size: clamp(2rem, 3vw, 3rem);
        margin-bottom: 14px;
      }

      h2 {
        font-size: clamp(1.5rem, 2vw, 2.1rem);
        margin-bottom: 16px;
      }

      h3 {
        font-size: 1.25rem;
        margin-bottom: 10px;
      }

      p {
        margin: 0 0 1rem 0;
        color: var(--muted);
      }

      ul, ol {
        color: var(--muted);
        margin: 0 0 1rem 1.2rem;
        padding-left: 1rem;
      }

      li {
        margin-bottom: 0.5rem;
      }

      .grid {
        display: grid;
        gap: 22px;
      }

      .two-col {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .three-col {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 8px 24px rgba(16, 39, 67, 0.05);
      }

      .card h3 {
        margin-bottom: 10px;
      }

      .tag {
        display: inline-block;
        background: var(--primary-soft);
        color: var(--primary-deep);
        border: 1px solid rgba(29,111,214,0.18);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 20px;
      }

      .btn,
      .button-link {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 700;
        border: 1px solid transparent;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover,
      .button-link:hover {
        text-decoration: none;
        transform: translateY(-1px);
      }

      .btn-primary,
      .button-link.primary {
        background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
        color: white;
        box-shadow: 0 8px 18px rgba(29,111,214,0.22);
      }

      .button-link.secondary {
        background: var(--surface-soft);
        color: var(--primary-deep);
        border-color: var(--line);
      }

      .badge-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 14px;
      }

      .badge {
        background: var(--surface-soft);
        color: var(--primary-deep);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .muted-box {
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-left: 4px solid var(--primary);
        padding: 18px 20px;
        border-radius: 16px;
      }

      .contact-list strong {
        color: var(--text);
      }

      .rule {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 22px 0;
      }

      .footer {
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 20px 32px;
      }

      .footer-inner {
        border-top: 1px solid var(--line);
        padding-top: 22px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .two-col,
        .three-col {
          grid-template-columns: 1fr;
        }

        .brand-row {
          align-items: flex-start;
        }

        .main-nav {
          justify-content: flex-start;
        }
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <div class="brand-row">
          <div class="brand">
            <span class="brand-mark">BI</span>
            <span class="brand-name">Big Infrastructures</span>
          </div>

          <nav class="main-nav" aria-label="Main navigation">
            <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
            <a href="{{ '/services/' | relative_url }}" {% if page.url contains '/services' %}class="active"{% endif %}>Services</a>
            <a href="{{ '/payments/' | relative_url }}" {% if page.url contains '/payments' %}class="active"{% endif %}>Payments</a>
            <a href="{{ '/declarations' | relative_url }}" {% if page.url contains '/declarations' %}class="active"{% endif %}>Declarations</a>
            <a href="{{ '/admin' | relative_url }}">Login</a>
          </nav>
        </div>
      </div>
    </header>

    <main class="page-shell">
      {{ content }}
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <p>&copy; 2026 Mr. Yash Lohana. All rights reserved.</p>
        <p>This code is licensed for use with proper acknowledgment of ownership.</p>
      </div>
    </footer>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </body>
</html>
